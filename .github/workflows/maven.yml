# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on: [ push, pull_request ]

env:
  # VERSION_SUFFIX is:
  #  - 'SNAPSHOT' if the push is on main
  #  - the branch name if the push is on a non-main branch
  #  - empty otherwise (tag or pull request)
  VERSION_SUFFIX: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'SNAPSHOT' || github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          cache: 'maven'
          java-version: '21'
          distribution: 'temurin'
      - if: ${{ env.VERSION_SUFFIX != '' }}
        name: Append suffix (${{ env.VERSION_SUFFIX }}) to version
        run: |
          mvn versions:set -DremoveSnapshot
          VERSION=$(mvn help:evaluate -N -Dexpression=project.version -q -DforceStdout)
          mvn versions:set -DnewVersion="$VERSION-${VERSION_SUFFIX##*/}"
      - name: Package with Maven
        run: mvn -B package --file pom.xml
      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jars
          retention-days: 2
          path: |
            target/*.jar
            !target/*-with-dependencies.jar